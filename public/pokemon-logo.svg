<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" role="img" aria-label="Pokémon">
  <defs>
    <style>
      .logo-text {
        font-family: Impact, 'Arial Black', 'Franklin Gothic Medium', sans-serif;
        font-size: 80px;
        font-style: italic;
        font-weight: 900;
        letter-spacing: -1px;
      }
    </style>
  </defs>
  <!-- Dark outline layer -->
  <text class="logo-text" x="50%" y="76"
    text-anchor="middle"
    fill="none"
    stroke="#1a1a1a"
    stroke-width="10"
    stroke-linejoin="round"
    paint-order="stroke"
  >Pokémon</text>
  <!-- Blue outline layer -->
  <text class="logo-text" x="50%" y="76"
    text-anchor="middle"
    fill="none"
    stroke="#2563a8"
    stroke-width="6"
    stroke-linejoin="round"
    paint-order="stroke"
  >Pokémon</text>
  <!-- Yellow fill -->
  <text class="logo-text" x="50%" y="76"
    text-anchor="middle"
    fill="#FFCC00"
  >Pokémon</text>
</svg>
