<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Bottom half: white -->
  <circle cx="50" cy="50" r="50" fill="#fff"/>
  <!-- Top half: red -->
  <path d="M0 50 A50 50 0 0 1 100 50 Z" fill="#e63946"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="50" fill="none" stroke="#1a1a1a" stroke-width="5"/>
  <!-- Centre band -->
  <rect x="0" y="44" width="100" height="12" fill="#1a1a1a"/>
  <!-- Centre button (outer black) -->
  <circle cx="50" cy="50" r="14" fill="#1a1a1a"/>
  <!-- Centre button (inner white) -->
  <circle cx="50" cy="50" r="9" fill="#fff"/>
</svg>
